name: Preview Builds

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to preview
        required: true
        default: RTL-layout
        type: string

permissions:
  contents: read

concurrency:
  group: preview-builds-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve preview commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      short_sha: ${{ steps.commit.outputs.short_sha }}
    steps:
      - name: Resolve requested ref
        id: commit
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PREVIEW_REF: ${{ inputs.ref }}
        with:
          script: |
            const { data: commit } = await github.rest.repos.getCommit({
              ...context.repo,
              ref: process.env.PREVIEW_REF,
            });
            core.setOutput("sha", commit.sha);
            core.setOutput("short_sha", commit.sha.slice(0, 12));
            await core.summary.addHeading("Preview source").addLink(commit.sha, commit.html_url).write();

  web:
    name: Web Preview
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout preview commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/web... --filter=@t3tools/scripts...

      - name: Build web preview
        env:
          VITE_RELEASE_CHANNEL: preview
        run: vp run --filter @t3tools/web build

      - name: Upload web preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-preview-${{ needs.resolve.outputs.short_sha }}
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: Desktop Preview
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout preview commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Build desktop preview bundle
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: vp run build:desktop:bundle

      - name: Upload desktop preview bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-preview-js-bundle-${{ needs.resolve.outputs.short_sha }}
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 7
